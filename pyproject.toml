[project]
name = "easy-fastapi"
version = "0.1.0"
description = "A modular and extensible FastAPI project template."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0,<2.1", "alembic>=1.14,<2", "asyncpg>=0.30,<1"]
mysql = ["sqlalchemy[asyncio]>=2.0,<2.1", "alembic>=1.14,<2", "asyncmy>=0.2.10,<1", "cryptography>=44"]
redis = ["redis>=5.2,<9"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx2>=2.13,<3.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: 需要真实数据库和 Redis 服务"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
allowed-confusables = ["，", "；"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true
