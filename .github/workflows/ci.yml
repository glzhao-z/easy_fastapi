name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras --python ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked --all-extras mypy app tests migrations

      - name: Test
        run: uv run --locked --all-extras pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Start integration services
        run: docker compose -p easy-fastapi-ci -f compose.test.yml up -d --wait

      - name: Test real services and migrations
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:15432/easy_fastapi
          TEST_MYSQL_URL: mysql+asyncmy://root:mysql@127.0.0.1:13306/easy_fastapi
          TEST_REDIS_URL: redis://127.0.0.1:16379/0
        run: uv run --locked --all-extras pytest tests/test_infrastructure.py tests/test_migrations.py

      - name: Stop integration services
        if: always()
        run: docker compose -p easy-fastapi-ci -f compose.test.yml down -v
